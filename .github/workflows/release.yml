name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:install

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run build

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp plugin/hw-memory.ts dist/hw-memory.ts
          cp plugin/hw-memory.md dist/hw-memory.md
          cd dist
          sha256sum hw-memory.ts hw-memory.md > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/hw-memory.ts dist/hw-memory.md dist/SHA256SUMS
